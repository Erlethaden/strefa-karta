<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Misji PDA · Strefa</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@300;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --g-hi:  #7ec840;
  --g-mid: #4a7830;
  --g-dim: #2a4818;
  --g-dk:  #0f1608;
  --am:    #c8a030;
  --am-dk: #8a6818;
  --bg:    #070a05;
  --surf:  #0b0f07;
  --bord:  #16200e;
}

body {
  background: var(--bg);
  color: var(--g-hi);
  font-family: 'Share Tech Mono', monospace;
  min-height: 100vh;
  padding: 44px 24px 64px;
}

/* PAGE HEADER */
.ph { text-align: center; margin-bottom: 44px; }
.ph-eye {
  font-family: 'Oswald', sans-serif; font-weight: 300;
  font-size: 9px; letter-spacing: 9px;
  color: var(--g-dim); text-transform: uppercase; margin-bottom: 6px;
}
.ph-title {
  font-family: 'Oswald', sans-serif; font-weight: 700;
  font-size: 30px; letter-spacing: 5px;
  color: var(--g-hi); text-transform: uppercase;
}
.ph-title em { color: var(--am); font-style: normal; }
.ph-rule {
  width: 56px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--g-dim), transparent);
  margin: 12px auto 0;
}

/* LAYOUT: single column centred */
.layout {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 36px;
  max-width: 560px;
  margin: 0 auto;
  width: 100%;
}

/* FORM */
.fp {
  width: 100%;
  background: var(--surf);
  border: 1px solid var(--bord);
  border-top: 2px solid var(--g-mid);
  padding: 26px 26px 30px;
}
.fp-ttl {
  font-family: 'Oswald', sans-serif; font-weight: 300;
  font-size: 8px; letter-spacing: 6px;
  color: var(--g-dim); text-transform: uppercase;
  margin-bottom: 24px; padding-bottom: 11px;
  border-bottom: 1px solid var(--bord);
}
.fg { margin-bottom: 18px; }
.fg label {
  display: block; font-size: 8px; letter-spacing: 3px;
  color: var(--g-mid); text-transform: uppercase; margin-bottom: 7px;
}
.fg label .opt { color: var(--g-dim); font-size: 7px; }
.fg input,
.fg textarea {
  display: block; width: 100%;
  background: #070a05;
  border: 1px solid var(--bord);
  border-bottom: 2px solid var(--g-dim);
  color: var(--g-hi);
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px; padding: 10px 12px;
  outline: none; resize: vertical;
  transition: border-color .15s, box-shadow .15s;
}
.fg input:focus, .fg textarea:focus {
  border-bottom-color: var(--g-mid);
  box-shadow: 0 3px 12px rgba(80,200,40,.07);
}
.fg input::placeholder, .fg textarea::placeholder { color: var(--g-dk); }
.fg textarea { height: 120px; line-height: 1.7; }
.fp-hint {
  font-size: 8px; letter-spacing: 1px; color: var(--g-dim);
  margin-top: 12px; padding-top: 13px; border-top: 1px solid var(--bord);
}
.fp-hint span { color: var(--g-mid); }

/* PDA WRAPPER */
.pw {
  display: flex; flex-direction: column;
  align-items: center; gap: 12px;
  width: 100%;
}

/* ═══════════════════════════════
   PHYSICAL PDA — LANDSCAPE
   matches reference image
   ═══════════════════════════════ */
.pda {
  width: 520px;
  height: 330px;
  position: relative;

  /* Dark grey rubberised casing */
  background:
    /* subtle grip crosshatch */
    repeating-linear-gradient(
      45deg,
      rgba(255,255,255,.009) 0px, rgba(255,255,255,.009) 1px,
      transparent 1px, transparent 5px
    ),
    linear-gradient(155deg, #2e2e2a 0%, #252522 30%, #1e1e1c 60%, #161614 100%);

  border-radius: 14px;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  padding: 18px 16px 18px 18px;
  gap: 12px;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    inset 0 -1px 3px rgba(0,0,0,.5),
    0 0 0 1px #050504,
    8px 18px 52px rgba(0,0,0,.96),
    0 2px 8px rgba(0,0,0,.5);
}

/* Wear / surface scratches */
.pda::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  background:
    linear-gradient(49deg, transparent 28%, rgba(255,255,255,.012) 29%, transparent 30%),
    linear-gradient(130deg, transparent 62%, rgba(255,255,255,.01) 63%, transparent 64%);
  pointer-events: none;
  z-index: 0;
}

/* ── LEFT STRIP (lens / port) ── */
.pda-left {
  width: 22px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding-bottom: 8px;
  position: relative;
  z-index: 1;
}

.pda-lens {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 38%, #2a2a26, #0a0a08);
  border: 2px solid #0c0c0a;
  box-shadow:
    inset 0 2px 6px rgba(0,0,0,.9),
    0 0 0 2px #1c1c1a,
    0 1px 4px rgba(0,0,0,.7);
}

/* ── SCREEN AREA (flex 1) ── */
.pda-mid {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}

/* Thick bezel around the screen */
.pda-bezel {
  flex: 1;
  background: #090908;
  border-radius: 5px;
  padding: 5px;
  box-shadow:
    inset 0 0 0 1px #000,
    inset 0 0 20px rgba(40,120,15,.05);
}

.pda-screen {
  width: 100%; height: 100%;
  background: #020602;
  border-radius: 3px;
  padding: 10px 11px;
  position: relative;
  overflow: hidden;
}

/* Scanlines (real div — renders in html2canvas) */
.sc-lines {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px, transparent 2px,
    rgba(0,0,0,.24) 2px, rgba(0,0,0,.24) 4px
  );
  pointer-events: none; z-index: 20;
}

/* Vignette */
.sc-vig {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 100% 100% at 50% 50%,
    transparent 38%, rgba(0,0,0,.58) 100%);
  pointer-events: none; z-index: 21;
}

.sc-content { position: relative; z-index: 5; height: 100%; }

/* ── STATUS BAR ── */
.sc-bar {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 7px; color: var(--g-dim); letter-spacing: .4px;
  padding-bottom: 6px; border-bottom: 1px solid #0c1408;
  margin-bottom: 8px; line-height: 1;
}
.sc-bar-new { color: #4a7430; }

/* ── TWO-COLUMN LAYOUT ── */
.sc-cols {
  display: grid;
  grid-template-columns: 118px 1fr;
  gap: 10px;
  height: calc(100% - 24px);
}

.sc-col-l {
  border-right: 1px solid #0c1408;
  padding-right: 10px;
}

/* ── SCREEN TYPOGRAPHY ── */
.sc-lbl {
  font-size: 6.5px; letter-spacing: 2px;
  color: var(--g-dim); text-transform: uppercase; margin-bottom: 3px;
}
.sc-val {
  font-size: 9.5px; color: var(--g-mid);
  line-height: 1.45; margin-bottom: 8px;
  text-shadow: 0 0 7px rgba(100,200,50,.18);
}
.sc-hr { border: none; border-top: 1px solid #0c1408; margin: 7px 0; }

.sc-alert { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; }
.sc-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--am); box-shadow: 0 0 5px rgba(200,160,48,.52);
  flex-shrink: 0;
}
.sc-alert-lbl {
  font-size: 7px; letter-spacing: 3px;
  color: var(--am); text-transform: uppercase;
}

.sc-subj {
  font-size: 11px; color: var(--g-hi);
  line-height: 1.4; letter-spacing: .5px;
  text-transform: uppercase; margin-bottom: 7px;
  text-shadow: 0 0 10px rgba(120,220,60,.22);
}
.sc-body {
  font-size: 8.5px; color: var(--g-mid);
  line-height: 1.85; letter-spacing: .15px;
  text-shadow: 0 0 5px rgba(80,180,40,.13);
}

.sc-rew-lbl {
  font-size: 6.5px; letter-spacing: 2px;
  color: var(--am-dk); text-transform: uppercase; margin-bottom: 3px;
}
.sc-rew-val {
  font-size: 10px; color: var(--am);
  letter-spacing: .5px;
  text-shadow: 0 0 7px rgba(200,160,48,.25);
}

/* ── EMPTY STATE ── */
.sc-empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100%; min-height: 220px;
}
.sc-empty-g { font-size: 20px; color: var(--g-dim); margin-bottom: 10px; opacity: .35; }
.sc-empty-t {
  font-size: 7px; letter-spacing: 3px;
  color: var(--g-dim); text-transform: uppercase; opacity: .35;
}

/* ── RIGHT PANEL (buttons) ── */
.pda-right {
  width: 50px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 3px 0;
  position: relative;
  z-index: 1;
}

.pda-brand-v {
  font-family: 'Oswald', sans-serif; font-weight: 300;
  font-size: 6px; letter-spacing: 2px; color: #3a3a34;
  text-transform: uppercase; user-select: none;
  writing-mode: vertical-rl; transform: rotate(180deg);
}

/* Main action buttons (4 stacked circles like reference image) */
.pda-act {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}

.prb {
  width: 18px; height: 18px; border-radius: 50%;
  background: radial-gradient(circle at 36% 33%, #303028, #1c1c18);
  border: 1px solid #111110;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.055),
    inset 0 -1px 2px rgba(0,0,0,.5),
    0 2px 5px rgba(0,0,0,.7);
}

/* Small nav cross */
.pda-nav {
  display: grid;
  grid-template-columns: repeat(3, 10px);
  grid-template-rows: repeat(3, 10px);
  gap: 1.5px;
}
.pnd { background: #1c1c18; border: 1px solid #111; border-radius: 1px; }
.pnc { border-radius: 50%; background: #171714; }
.pnv { background: transparent; border: none; }

/* Signal bars + LED at bottom of right panel */
.pda-status {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}

.pda-sig {
  display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
}
.sbv { height: 2px; border-radius: 1px; background: #2c2c24; }
.sbv.on { background: #426030; }
.sbv:nth-child(1) { width: 14px; }
.sbv:nth-child(2) { width: 11px; }
.sbv:nth-child(3) { width: 8px; }
.sbv:nth-child(4) { width: 5px; }

.led {
  width: 6px; height: 6px; border-radius: 50%;
  background: #1a2a10;
  transition: background .3s, box-shadow .3s;
}
.led.on { background: #5c9a30; box-shadow: 0 0 8px rgba(80,200,40,.65); }

/* EXPORT BUTTON */
.btn-exp {
  width: 520px; max-width: 100%;
  background: transparent;
  border: 1px solid var(--g-dim); color: var(--g-dim);
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px; letter-spacing: 4px; text-transform: uppercase;
  padding: 9px; cursor: pointer; transition: all .2s;
}
.btn-exp:hover { border-color: var(--g-mid); color: var(--g-mid); box-shadow: 0 0 14px rgba(80,180,40,.08); }
.btn-exp:disabled { opacity: .35; cursor: wait; }

/* RESPONSIVE */
@media (max-width: 570px) {
  .pda { width: 100%; height: auto; }
  .pda-screen { min-height: 200px; }
  .btn-exp { width: 100%; }
  .sc-cols { grid-template-columns: 95px 1fr; gap: 8px; }
}
</style>
</head>
<body>

<header class="ph">
  <p class="ph-eye">Strefa · Tabletop RPG</p>
  <p class="ph-title">Generator Misji <em>PDA</em></p>
  <div class="ph-rule"></div>
</header>

<div class="layout">

  <!-- FORM -->
  <div class="fp">
    <p class="fp-ttl">Dane wiadomości</p>
    <div class="fg">
      <label>Temat wiadomości</label>
      <input id="fi-sub" type="text" placeholder="Zaginiony kurier">
    </div>
    <div class="fg">
      <label>Nadawca</label>
      <input id="fi-sndr" type="text" placeholder="Sierżant Barchuk, brama wschodnia">
    </div>
    <div class="fg">
      <label>Treść wiadomości</label>
      <textarea id="fi-body" placeholder="Kurier z ważną przesyłką miał dotrzeć z Kordonu do Rostoku przed świtem..."></textarea>
    </div>
    <div class="fg">
      <label>Nagroda <span class="opt">(opcjonalnie)</span></label>
      <input id="fi-rew" type="text" placeholder="3000 RU + amunicja 9×18mm">
    </div>
    <p class="fp-hint">Podgląd aktualizuje się <span>na żywo</span>.</p>
  </div>

  <!-- PDA DEVICE -->
  <div class="pw">

    <div class="pda" id="pda-device">

      <!-- LEFT: obiektyw / port -->
      <div class="pda-left">
        <div class="pda-lens"></div>
      </div>

      <!-- CENTER: ekran -->
      <div class="pda-mid">
        <div class="pda-bezel">
          <div class="pda-screen">
            <div class="sc-lines"></div>
            <div class="sc-vig"></div>
            <div class="sc-content" id="sc-content">
              <div class="sc-empty">
                <div class="sc-empty-g">▣</div>
                <div class="sc-empty-t">Brak wiadomości</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT: przyciski -->
      <div class="pda-right">

        <div class="pda-brand-v">PDA·K</div>

        <div class="pda-act">
          <div class="prb"></div>
          <div class="prb"></div>
          <div class="pda-nav">
            <div class="pnv"></div><div class="pnd"></div><div class="pnv"></div>
            <div class="pnd"></div><div class="pnd pnc"></div><div class="pnd"></div>
            <div class="pnv"></div><div class="pnd"></div><div class="pnv"></div>
          </div>
          <div class="prb"></div>
        </div>

        <div class="pda-status">
          <div class="pda-sig">
            <div class="sbv on"></div>
            <div class="sbv on"></div>
            <div class="sbv on"></div>
            <div class="sbv"></div>
          </div>
          <div class="led" id="pda-led"></div>
        </div>

      </div>

    </div>

    <button class="btn-exp" id="btn-exp">↓ Eksportuj PNG</button>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);

function esc(s) {
  const d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function nowStr() {
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function render() {
  const sub  = $('fi-sub').value.trim();
  const sndr = $('fi-sndr').value.trim();
  const body = $('fi-body').value.trim();
  const rew  = $('fi-rew').value.trim();
  const sc   = $('sc-content');
  const led  = $('pda-led');

  if (!sub && !sndr && !body) {
    led.classList.remove('on');
    sc.innerHTML = `<div class="sc-empty">
      <div class="sc-empty-g">▣</div>
      <div class="sc-empty-t">Brak wiadomości</div>
    </div>`;
    return;
  }

  led.classList.add('on');

  const leftCol = `
    ${sndr ? `<div class="sc-lbl">Nadawca</div><div class="sc-val">${esc(sndr)}</div>` : ''}
    ${rew ? `<hr class="sc-hr"><div class="sc-rew-lbl">Nagroda</div><div class="sc-rew-val">${esc(rew)}</div>` : ''}
  `;

  const rightCol = `
    <div class="sc-alert">
      <div class="sc-dot"></div>
      <div class="sc-alert-lbl">Zlecenie zadania</div>
    </div>
    ${sub ? `<div class="sc-subj">${esc(sub)}</div>` : ''}
    ${sub && body ? `<hr class="sc-hr">` : ''}
    ${body ? `<div class="sc-body">${esc(body).replace(/\n/g,'<br>')}</div>` : ''}
  `;

  sc.innerHTML = `
    <div class="sc-bar">
      <span class="sc-bar-new">● NOWA WIADOMOŚĆ</span>
      <span>${nowStr()}</span>
    </div>
    <div class="sc-cols">
      <div class="sc-col-l">${leftCol}</div>
      <div class="sc-col-r">${rightCol}</div>
    </div>
  `;
}

['fi-sub','fi-sndr','fi-body','fi-rew'].forEach(id =>
  $(id).addEventListener('input', render)
);

$('btn-exp').addEventListener('click', async () => {
  const btn = $('btn-exp');
  btn.disabled = true;
  btn.textContent = '... renderowanie ...';
  try {
    await document.fonts.ready;
    const el = $('pda-device');
    const raw = await html2canvas(el, {
      scale: 3,
      backgroundColor: '#090b06',
      useCORS: true,
      logging: false,
    });
    // Add padding so drop-shadow is visible in export
    const pad = 52;
    const out = document.createElement('canvas');
    out.width  = raw.width  + pad * 2;
    out.height = raw.height + pad * 2;
    const ctx = out.getContext('2d');
    ctx.fillStyle = '#090b06';
    ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(raw, pad, pad);

    const a = document.createElement('a');
    const slug = $('fi-sub').value.trim()
      .replace(/\s+/g,'_').replace(/[^\w\-ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g,'') || 'misja';
    a.download = `pda_${slug}.png`;
    a.href = out.toDataURL('image/png');
    a.click();
  } catch(e) { alert('Błąd eksportu: ' + e.message); }
  btn.disabled = false;
  btn.textContent = '↓ Eksportuj PNG';
});
</script>
</body>
</html>
