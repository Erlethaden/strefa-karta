<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Misji PDA · Strefa</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@300;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* ── SCREEN TEKST - bardzo jasny ── */
  --sc-hi:  #d4ff70;    /* prawie biały neonowy - temat */
  --sc-mid: #a8e040;    /* jasna zieleń - wartości, treść */
  --sc-dim: #78c028;    /* czytelna zieleń - etykiety */
  --sc-bar: #58921e;    /* pasek statusu */
  --sc-div: #3a5c16;    /* linia podziału */
  --am:     #ffcc44;    /* jaskrawy bursztyn - alerty */
  --am-dk:  #e0a030;    /* bursztyn dim - etykieta nagrody */
  /* ── UI strony ── */
  --g-hi:  #a0e040;    /* tekst w polach, główny */
  --g-mid: #80c028;    /* etykiety, górna krawędź formularza */
  --g-dim: #548018;    /* tytuł sekcji, hint, opt */
  --g-dk:  #364e1a;    /* placeholder */
  --bg:    #070a05;
  --surf:  #0d1209;
  --bord:  #2a4014;    /* krawędź formularza - wyraźna */
}

body {
  background: var(--bg);
  color: var(--g-hi);
  font-family: 'Share Tech Mono', monospace;
  min-height: 100vh;
  padding: 40px 20px 60px;
}

/* NAGŁÓWEK STRONY */
.ph { text-align: center; margin-bottom: 40px; }
.ph-eye {
  font-family: 'Oswald', sans-serif; font-weight: 300;
  font-size: 9px; letter-spacing: 9px;
  color: var(--g-dim); text-transform: uppercase; margin-bottom: 6px;
}
.ph-title {
  font-family: 'Oswald', sans-serif; font-weight: 700;
  font-size: 30px; letter-spacing: 5px;
  color: var(--g-hi); text-transform: uppercase;
}
.ph-title em { color: var(--am); font-style: normal; }
.ph-rule {
  width: 56px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--g-dim), transparent);
  margin: 12px auto 0;
}

/* LAYOUT */
.layout {
  display: flex; flex-direction: column; align-items: center;
  gap: 32px; max-width: 520px; margin: 0 auto; width: 100%;
}

/* FORMULARZ */
.fp {
  width: 100%;
  background: var(--surf);
  border: 1px solid var(--bord);
  border-top: 2px solid var(--g-mid);
  padding: 24px 24px 28px;
}
.fp-ttl {
  font-family: 'Oswald', sans-serif; font-weight: 300;
  font-size: 8px; letter-spacing: 6px; color: var(--g-dim);
  text-transform: uppercase; margin-bottom: 22px; padding-bottom: 11px;
  border-bottom: 1px solid var(--bord);
}
.fg { margin-bottom: 17px; }
.fg label {
  display: block; font-size: 8px; letter-spacing: 3px;
  color: var(--g-mid); text-transform: uppercase; margin-bottom: 7px;
}
.fg label .opt { color: var(--g-dim); font-size: 7px; }
.fg input, .fg textarea {
  display: block; width: 100%;
  background: #070a05;
  border: 1px solid var(--bord); border-bottom: 2px solid var(--g-dim);
  color: var(--g-hi);
  font-family: 'Share Tech Mono', monospace;
  font-size: 14px; padding: 10px 12px;
  outline: none; resize: vertical;
  transition: border-color .15s, box-shadow .15s;
}
.fg input:focus, .fg textarea:focus {
  border-bottom-color: var(--g-mid);
  box-shadow: 0 3px 12px rgba(80,200,40,.07);
}
.fg input::placeholder, .fg textarea::placeholder { color: var(--g-dk); }
.fg textarea { height: 120px; line-height: 1.7; }
.fp-hint {
  font-size: 8px; letter-spacing: 1px; color: var(--g-dim);
  margin-top: 12px; padding-top: 13px; border-top: 1px solid var(--bord);
}
.fp-hint span { color: var(--g-mid); }

/* PDA WRAPPER */
.pw { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }

/* Kontener do skalowania — overflow:hidden zapobiega poziomemu scrollowi */
.pda-wrap {
  width: 100%;
  overflow: hidden;
  position: relative;
}

/* ═══════════════════════════════════
   FIZYCZNY PDA — POZIOMY (landscape)
   ═══════════════════════════════════ */
.pda {
  width: 520px;
  height: 330px;
  flex-shrink: 0;
  position: relative;

  background:
    repeating-linear-gradient(45deg,
      rgba(255,255,255,.008) 0, rgba(255,255,255,.008) 1px,
      transparent 1px, transparent 5px),
    linear-gradient(155deg, #2e2e2a 0%, #252522 30%, #1e1e1c 60%, #161614 100%);

  border-radius: 14px;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  padding: 18px 16px 18px 18px;
  gap: 12px;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    inset 0 -1px 3px rgba(0,0,0,.5),
    0 0 0 1px #050504,
    8px 18px 52px rgba(0,0,0,.96);
}

.pda::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  background:
    linear-gradient(49deg, transparent 28%, rgba(255,255,255,.012) 29%, transparent 30%),
    linear-gradient(130deg, transparent 62%, rgba(255,255,255,.01) 63%, transparent 64%);
  pointer-events: none; z-index: 0;
}

/* LEWA KRAWĘDŹ — obiektyw */
.pda-left {
  width: 22px; flex-shrink: 0;
  display: flex; flex-direction: column;
  justify-content: flex-end; padding-bottom: 8px;
  position: relative; z-index: 1;
}
.pda-lens {
  width: 18px; height: 18px; border-radius: 50%;
  background: radial-gradient(circle at 38% 38%, #2a2a26, #0a0a08);
  border: 2px solid #0c0c0a;
  box-shadow: inset 0 2px 6px rgba(0,0,0,.9), 0 0 0 2px #1c1c1a;
}

/* EKRAN */
.pda-mid {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  position: relative; z-index: 1;
}
.pda-bezel {
  flex: 1;
  background: #090908; border-radius: 5px; padding: 5px;
  display: flex; flex-direction: column;
  box-shadow: inset 0 0 0 1px #000;
}
.pda-screen {
  flex: 1;
  background: #030a03; border-radius: 3px;
  padding: 10px 11px;
  position: relative; overflow: hidden;
}

/* Scanlines (div, nie pseudo — działa w html2canvas) */
.sc-lines {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0, transparent 3px,
    rgba(0,0,0,.08) 3px, rgba(0,0,0,.08) 4px
  );
  pointer-events: none; z-index: 20;
}
/* Winieta */
.sc-vig {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 100% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.30) 100%);
  pointer-events: none; z-index: 21;
}
.sc-content { position: relative; z-index: 5; height: 100%; }

/* ── PASEK STATUSU ── */
.sc-bar {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 8px; color: var(--sc-bar); letter-spacing: .4px;
  padding-bottom: 6px; border-bottom: 1px solid var(--sc-div);
  margin-bottom: 8px; line-height: 1;
}
.sc-bar-new { color: #90d030; }

/* ── DWIE KOLUMNY ── */
.sc-cols { display: grid; grid-template-columns: 118px 1fr; gap: 10px; }
.sc-col-l { border-right: 1px solid var(--sc-div); padding-right: 10px; }

/* ── TYPOGRAFIA EKRANU ── */
.sc-lbl {
  font-size: 7px; letter-spacing: 2px;
  color: var(--sc-dim); text-transform: uppercase; margin-bottom: 3px;
}
.sc-val { font-size: 10.5px; color: var(--sc-mid); line-height: 1.45; margin-bottom: 8px; }
.sc-hr  { border: none; border-top: 1px solid var(--sc-div); margin: 7px 0; }

.sc-alert { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; }
.sc-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--am); box-shadow: 0 0 5px rgba(218,184,60,.55);
  flex-shrink: 0;
}
.sc-alert-lbl { font-size: 8px; letter-spacing: 3px; color: var(--am); text-transform: uppercase; }

.sc-subj {
  font-size: 12px; color: var(--sc-hi);
  line-height: 1.4; letter-spacing: .5px;
  text-transform: uppercase; margin-bottom: 7px;
}
.sc-body { font-size: 9.5px; color: var(--sc-mid); line-height: 1.8; letter-spacing: .15px; }

.sc-rew-lbl { font-size: 7px; letter-spacing: 2px; color: var(--am-dk); text-transform: uppercase; margin-bottom: 3px; }
.sc-rew-val { font-size: 10.5px; color: var(--am); letter-spacing: .5px; }

/* PUSTY EKRAN */
.sc-empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; height: 100%;
}
.sc-empty-g { font-size: 22px; color: var(--sc-dim); margin-bottom: 10px; opacity: .45; }
.sc-empty-t { font-size: 8px; letter-spacing: 3px; color: var(--sc-dim); text-transform: uppercase; opacity: .45; }

/* PRAWA KRAWĘDŹ — przyciski */
.pda-right {
  width: 50px; flex-shrink: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: space-between;
  padding: 3px 0; position: relative; z-index: 1;
}
.pda-brand-v {
  font-family: 'Oswald', sans-serif; font-weight: 300;
  font-size: 6px; letter-spacing: 2px; color: #3a3a34;
  text-transform: uppercase; user-select: none;
  writing-mode: vertical-rl; transform: rotate(180deg);
}
.pda-act { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.prb {
  width: 18px; height: 18px; border-radius: 50%;
  background: radial-gradient(circle at 36% 33%, #303028, #1c1c18);
  border: 1px solid #111110;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.055), 0 2px 5px rgba(0,0,0,.7);
}
.pda-nav {
  display: grid; grid-template-columns: repeat(3, 10px);
  grid-template-rows: repeat(3, 10px); gap: 1.5px;
}
.pnd { background: #1c1c18; border: 1px solid #111; border-radius: 1px; }
.pnc { border-radius: 50%; background: #171714; }
.pnv { background: transparent; border: none; }

.pda-status { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pda-sig    { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.sbv { height: 2px; border-radius: 1px; background: #2c2c24; }
.sbv.on { background: #426030; }
.sbv:nth-child(1){width:14px}.sbv:nth-child(2){width:11px}.sbv:nth-child(3){width:8px}.sbv:nth-child(4){width:5px}
.led { width: 6px; height: 6px; border-radius: 50%; background: #1a2a10; transition: background .3s, box-shadow .3s; }
.led.on { background: #5c9a30; box-shadow: 0 0 8px rgba(80,200,40,.65); }

/* PRZYCISK EKSPORTU */
.btn-exp {
  width: 100%; max-width: 520px;
  background: transparent;
  border: 1px solid var(--g-dim); color: var(--g-dim);
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px; letter-spacing: 4px; text-transform: uppercase;
  padding: 9px; cursor: pointer; transition: all .2s;
}
.btn-exp:hover { border-color: var(--g-mid); color: var(--g-mid); }
.btn-exp:disabled { opacity: .35; cursor: wait; }

/* ── MODAL EKSPORTU ── */
#exp-modal {
  position: fixed; inset: 0; z-index: 9999;
  display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,.93);
  padding: 20px;
}
#exp-modal.open { display: flex; }
#exp-box {
  background: #0d1209;
  border: 1px solid #2a4014;
  border-top: 2px solid #80c028;
  max-width: min(94vw, 660px);
  width: 100%;
  display: flex; flex-direction: column;
}
#exp-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid #2a4014;
}
#exp-head-lbl {
  font-family: 'Oswald', sans-serif; font-weight: 300;
  font-size: 8px; letter-spacing: 6px; color: #548018; text-transform: uppercase;
}
#exp-close {
  background: transparent; border: 1px solid #2a4014;
  color: #548018; font-size: 13px; cursor: pointer;
  width: 26px; height: 26px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
#exp-close:hover { border-color: #80c028; color: #a0e040; }
#exp-inst {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px; color: #80c028; letter-spacing: .3px; line-height: 1.6;
  padding: 11px 16px;
  border-bottom: 1px solid #2a4014;
}
#exp-inst strong { color: #d4ff70; }
#exp-img-wrap {
  padding: 16px; display: flex; justify-content: center;
  background: #070a05;
}
#exp-img { max-width: 100%; height: auto; display: block; }
#exp-dl {
  display: block; margin: 0 16px 16px; text-align: center;
  background: transparent; border: 1px solid #2a4014;
  color: #548018; font-family: 'Share Tech Mono', monospace;
  font-size: 9px; letter-spacing: 4px; text-transform: uppercase;
  padding: 10px; text-decoration: none; transition: all .2s;
}
#exp-dl:hover { border-color: #80c028; color: #80c028; }

/* Przyciski eksportów */
.export-row {
  display: flex; gap: 8px; width: 100%; max-width: 520px;
}
.export-row .btn-exp { flex: 1; }
.btn-exp-gif  { border-color: #2a5038 !important; color: #3a7050 !important; }
.btn-exp-gif:hover  { border-color: #50a068 !important; color: #60c080 !important; }
.btn-exp-vid  { border-color: #3a3820 !important; color: #6a6020 !important; }
.btn-exp-vid:hover  { border-color: #b0a030 !important; color: #d0c040 !important; }
#exp-media { padding: 16px; display: flex; justify-content: center; background: #070a05; }
#exp-media img, #exp-media video { max-width: 100%; height: auto; display: block; }
</style>
</head>
<body>

<header class="ph">
  <p class="ph-eye">Strefa · Tabletop RPG</p>
  <p class="ph-title">Generator Misji <em>PDA</em></p>
  <div class="ph-rule"></div>
</header>

<div class="layout">

  <div class="fp">
    <p class="fp-ttl">Dane wiadomości</p>
    <div class="fg">
      <label>Temat wiadomości</label>
      <input id="fi-sub" type="text" placeholder="Zaginiony kurier">
    </div>
    <div class="fg">
      <label>Nadawca</label>
      <input id="fi-sndr" type="text" placeholder="Sierżant Barchuk, brama wschodnia">
    </div>
    <div class="fg">
      <label>Treść wiadomości</label>
      <textarea id="fi-body" placeholder="Kurier z ważną przesyłką miał dotrzeć z Kordonu do Rostoku przed świtem..."></textarea>
    </div>
    <div class="fg">
      <label>Nagroda <span class="opt">(opcjonalnie)</span></label>
      <input id="fi-rew" type="text" placeholder="3000 RU + amunicja 9×18mm">
    </div>
    <p class="fp-hint">Podgląd aktualizuje się <span>na żywo</span>. Eksport PNG zawsze w pełnej rozdzielczości.</p>
  </div>

  <div class="pw">
    <div class="pda-wrap" id="pda-wrap">
      <div class="pda" id="pda-device">

        <div class="pda-left"><div class="pda-lens"></div></div>

        <div class="pda-mid">
          <div class="pda-bezel">
            <div class="pda-screen">
              <div class="sc-lines"></div>
              <div class="sc-vig"></div>
              <div class="sc-content" id="sc-content">
                <div class="sc-empty">
                  <div class="sc-empty-g">▣</div>
                  <div class="sc-empty-t">Brak wiadomości</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="pda-right">
          <div class="pda-brand-v">PDA·K</div>
          <div class="pda-act">
            <div class="prb"></div>
            <div class="prb"></div>
            <div class="pda-nav">
              <div class="pnv"></div><div class="pnd"></div><div class="pnv"></div>
              <div class="pnd"></div><div class="pnd pnc"></div><div class="pnd"></div>
              <div class="pnv"></div><div class="pnd"></div><div class="pnv"></div>
            </div>
            <div class="prb"></div>
          </div>
          <div class="pda-status">
            <div class="pda-sig">
              <div class="sbv on"></div><div class="sbv on"></div>
              <div class="sbv on"></div><div class="sbv"></div>
            </div>
            <div class="led" id="pda-led"></div>
          </div>
        </div>

      </div>
    </div>
    <button class="btn-exp" id="btn-exp">↓ Eksportuj PNG</button>
    <div class="export-row">
      <button class="btn-exp btn-exp-gif" id="btn-gif">☀ GIF (animacja)</button>
      <button class="btn-exp btn-exp-vid" id="btn-vid">▶ Wideo + dźwięk</button>
    </div>
  </div>

</div>

<!-- MODAL EKSPORTU -->
<div id="exp-modal">
  <div id="exp-box">
    <div id="exp-head">
      <span id="exp-head-lbl">Eksport misji PDA</span>
      <button id="exp-close">✕</button>
    </div>
    <div id="exp-inst"></div>
    <div id="exp-media"></div>
    <a id="exp-dl" href="#" download="">↓ Pobierz PNG</a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const PDA_W = 520, PDA_H = 330;

/* ── Skalowanie na telefonie ──
   PDA ma stały rozmiar 520×330 — JS zmniejsza go przez transform:scale
   żeby zmieścić się na wąskim ekranie. Eksport resetuje transform → pełna rozdzielczość. */
function scalePDA() {
  const wrap  = $('pda-wrap');
  const pda   = $('pda-device');
  const avail = wrap.clientWidth;
  if (avail < PDA_W) {
    const s = avail / PDA_W;
    pda.style.transform       = `scale(${s})`;
    pda.style.transformOrigin = 'top left';
    wrap.style.height         = Math.round(PDA_H * s) + 'px';
  } else {
    pda.style.transform       = '';
    pda.style.transformOrigin = '';
    wrap.style.height         = '';
  }
}
window.addEventListener('resize', scalePDA);
scalePDA();

/* ── Helpers ── */
function esc(s) {
  const d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}
function nowStr() {
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ── Renderowanie ekranu ── */
function render() {
  const sub  = $('fi-sub').value.trim();
  const sndr = $('fi-sndr').value.trim();
  const body = $('fi-body').value.trim();
  const rew  = $('fi-rew').value.trim();
  const sc   = $('sc-content');
  const led  = $('pda-led');

  if (!sub && !sndr && !body) {
    led.classList.remove('on');
    sc.innerHTML = `<div class="sc-empty"><div class="sc-empty-g">▣</div><div class="sc-empty-t">Brak wiadomości</div></div>`;
    return;
  }

  led.classList.add('on');

  sc.innerHTML = `
    <div class="sc-bar">
      <span class="sc-bar-new">● NOWA WIADOMOŚĆ</span>
      <span>${nowStr()}</span>
    </div>
    <div class="sc-cols">
      <div class="sc-col-l">
        ${sndr ? `<div class="sc-lbl">Nadawca</div><div class="sc-val">${esc(sndr)}</div>` : ''}
        ${rew  ? `<hr class="sc-hr"><div class="sc-rew-lbl">Nagroda</div><div class="sc-rew-val">${esc(rew)}</div>` : ''}
      </div>
      <div class="sc-col-r">
        <div class="sc-alert"><div class="sc-dot"></div><div class="sc-alert-lbl">Zlecenie zadania</div></div>
        ${sub  ? `<div class="sc-subj">${esc(sub)}</div>` : ''}
        ${sub && body ? `<hr class="sc-hr">` : ''}
        ${body ? `<div class="sc-body">${esc(body).replace(/\n/g,'<br>')}</div>` : ''}
      </div>
    </div>`;
}

['fi-sub','fi-sndr','fi-body','fi-rew'].forEach(id => $(id).addEventListener('input', render));


/* ══════════════════════════════════════

VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVX/+7JkAA/wAABpAAAACAAADSAAAAEAAAGkAAAAIAAANIAAAARMQU1FMy4xMDEgKGJldGEgMylVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVUxBTUUzLjEwMSAoYmV0YSAzKVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVU=';
const AUDIO_DURATION_MS = 5538; // ms

/* Pozycje animowanych elementów w układzie PDA (px, 520×330) */
const DOTS = [
  /* LED zielony — prawy panel, dół */
  { pdaX: 479, pdaY: 305, rFactor: 1.0, color: ['#4a8828','#8acc44'], period: 1.2, phase: 0,   type: 'blink' },
  /* Kropka statusu "●" — górny pasek ekranu */
  { pdaX:  70, pdaY:  40, rFactor: 0.7, color: ['#4a8828','#90d840'], period: 1.8, phase: 0.4, type: 'pulse' },
  /* Dot alarmu — bursztyn obok "Zlecenie zadania" */
  { pdaX: 200, pdaY:  62, rFactor: 0.9, color: ['#c89020','#ffcc44'], period: 0.9, phase: 0,   type: 'pulse' },
];

function toCV(pdaX, pdaY, scale, pad) {
  return [Math.round(pad + pdaX * scale), Math.round(pad + pdaY * scale)];
}

function drawGlow(ctx, x, y, outerR, innerR, outer, inner, alpha) {
  ctx.save();
  const g = ctx.createRadialGradient(x, y, 0, x, y, outerR);
  g.addColorStop(0,   inner);
  g.addColorStop(0.4, outer);
  g.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.globalAlpha = alpha;
  ctx.fillStyle   = g;
  ctx.beginPath(); ctx.arc(x, y, outerR, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = alpha * 0.95;
  ctx.fillStyle   = inner;
  ctx.beginPath(); ctx.arc(x, y, innerR, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawAnimFrame(ctx, base, t, scale, pad) {
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  ctx.drawImage(base, 0, 0);
  for (const d of DOTS) {
    const [cx, cy] = toCV(d.pdaX, d.pdaY, scale, pad);
    const r = 5 * scale * d.rFactor;
    let alpha;
    if (d.type === 'blink') {
      const cycle = ((t + d.phase) % d.period) / d.period;
      alpha = cycle < 0.6 ? Math.sin((cycle / 0.6) * Math.PI) : 0;
    } else {
      alpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(((t + d.phase) / d.period) * Math.PI * 2));
    }
    if (alpha > 0.01) drawGlow(ctx, cx, cy, r*2.2, r*0.55, d.color[0], d.color[1], alpha);
  }
}

/* Wspólna funkcja przechwycenia PDA */
async function captureBase(scale, pad) {
  const pda  = $('pda-device');
  const wrap = $('pda-wrap');
  const sT = pda.style.transform, sO = pda.style.transformOrigin, sH = wrap.style.height;
  pda.style.transform = ''; pda.style.transformOrigin = ''; wrap.style.height = PDA_H + 'px';
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  await document.fonts.ready;
  const raw = await html2canvas(pda, { scale, backgroundColor: '#090b06', useCORS: true, logging: false });
  const out = document.createElement('canvas');
  out.width  = raw.width  + pad * 2;
  out.height = raw.height + pad * 2;
  const c = out.getContext('2d');
  c.fillStyle = '#090b06'; c.fillRect(0, 0, out.width, out.height); c.drawImage(raw, pad, pad);
  pda.style.transform = sT; pda.style.transformOrigin = sO; wrap.style.height = sH;
  return out;
}

/* Pokaż wynik w modalu */
function showMediaModal(url, type, subject) {
  const inst  = $('exp-inst');
  const media = $('exp-media');
  const dl    = $('exp-dl');
  media.innerHTML = '';

  if (type === 'video') {
    const v = document.createElement('video');
    v.src = url; v.controls = true; v.autoplay = true; v.loop = true;
    v.style.cssText = 'max-width:100%;height:auto;display:block';
    media.appendChild(v);
    dl.href = url; dl.download = subject + '.webm';
    if (isMobile()) {
      inst.innerHTML = 'Odtwarzaj i <strong>przytrzymaj wideo</strong> → Zapisz wideo.';
    } else {
      inst.innerHTML = 'Kliknij <strong>Pobierz WebM</strong> — wideo z dźwiękiem.';
      dl.style.display = 'block';
    }
  } else {
    const img = document.createElement('img');
    img.src = url; img.alt = 'PDA misja';
    img.style.cssText = 'max-width:100%;height:auto;display:block';
    media.appendChild(img);
    const ext = type === 'gif' ? '.gif' : '.png';
    dl.href = url; dl.download = subject + ext;
    if (isMobile()) {
      inst.innerHTML = '<strong>Przytrzymaj obraz palcem</strong> → "Zapisz obraz".';
      dl.style.display = 'none';
    } else {
      inst.innerHTML = 'Kliknij <strong>Pobierz</strong> lub prawy klik → Zapisz jako.';
      dl.style.display = 'block';
    }
  }
  $('exp-modal').classList.add('open');
}

function getSlug() {
  return $('fi-sub').value.trim().replace(/\s+/g,'_').replace(/[^\w\-ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/g,'') || 'misja';
}

function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isMobile() {
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

/* Tekst przycisków zależnie od platformy */
if (isMobile()) {
  $('btn-exp').textContent = '↗ PNG';
  $('btn-gif').textContent = '☀ GIF';
}

/* Zamknij modal */
function closeModal() { $('exp-modal').classList.remove('open'); }
$('exp-close').addEventListener('click', closeModal);
$('exp-modal').addEventListener('click', e => { if (e.target === $('exp-modal')) closeModal(); });

/* ── PNG EXPORT ── */
$('btn-exp').addEventListener('click', async () => {
  const btn = $('btn-exp');
  btn.disabled = true;
  btn.textContent = '... renderowanie ...';
  try {
    const scale = isMobile() ? 2 : 3;
    const pad   = isMobile() ? 34 : 52;
    const base  = await captureBase(scale, pad);
    const dataUrl = base.toDataURL('image/png');
    if (!dataUrl || dataUrl.length < 100) throw new Error('Canvas pusty.');
    showMediaModal(dataUrl, 'png', getSlug());
  } catch(e) {
    alert('Błąd eksportu:\n' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = isMobile() ? '↗ PNG' : '↓ Eksportuj PNG';
  }
});

/* ── GIF EXPORT ── */
$('btn-gif').addEventListener('click', async () => {
  const btn = $('btn-gif');
  btn.disabled = true; btn.textContent = '... przygotowanie ...';
  try {
    const scale = 2, pad = 34;
    const base  = await captureBase(scale, pad);

    // Wczytaj worker gif.js jako blob (omija CORS na worker)
    const workerText = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js').then(r => r.text());
    const workerUrl  = URL.createObjectURL(new Blob([workerText], {type:'application/javascript'}));

    const fps = 12, dur = 2; // 2-sekundowa pętla
    const frameDelay = Math.round(1000 / fps);
    const frames = fps * dur;

    const gif = new GIF({
      workers: 1, quality: 8, repeat: 0,
      width: base.width, height: base.height,
      workerScript: workerUrl,
    });

    const ac = document.createElement('canvas');
    ac.width = base.width; ac.height = base.height;
    const ctx = ac.getContext('2d');

    for (let i = 0; i < frames; i++) {
      drawAnimFrame(ctx, base, (i / frames) * dur, scale, pad);
      gif.addFrame(ctx, { copy: true, delay: frameDelay });
    }

    gif.on('progress', p => { btn.textContent = `☀ GIF ${Math.round(p*100)}%...`; });
    gif.on('finished', blob => {
      URL.revokeObjectURL(workerUrl);
      showMediaModal(URL.createObjectURL(blob), 'gif', getSlug());
      btn.disabled = false; btn.textContent = '☀ GIF (animacja)';
    });
    gif.render();
  } catch(e) {
    alert('Błąd GIF: ' + e.message);
    btn.disabled = false; btn.textContent = '☀ GIF (animacja)';
  }
});

/* ── VIDEO + AUDIO EXPORT ── */
$('btn-vid').addEventListener('click', async () => {
  const btn = $('btn-vid');

  // Sprawdź wsparcie MediaRecorder
  const mimes = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mime  = mimes.find(t => {try{return MediaRecorder.isTypeSupported(t)}catch{return false}});
  if (!mime) {
    alert('Twoja przeglądarka nie obsługuje nagrywania wideo.\nUżyj Chrome lub Firefox na desktopie.');
    return;
  }

  btn.disabled = true; btn.textContent = '... renderowanie ...';

  try {
    const scale = 2, pad = 34;
    const base  = await captureBase(scale, pad);

    const ac  = document.createElement('canvas');
    ac.width  = base.width; ac.height = base.height;
    const ctx = ac.getContext('2d');

    // Audio
    const audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
    const arrayBuf   = await fetch(AUDIO_DATA_URL).then(r => r.arrayBuffer());
    const audioBuf   = await audioCtx.decodeAudioData(arrayBuf);
    const src        = audioCtx.createBufferSource();
    src.buffer       = audioBuf;
    const audioDest  = audioCtx.createMediaStreamDestination();
    src.connect(audioDest);

    // Streams
    const videoStream = ac.captureStream(24);
    const combined    = new MediaStream([
      ...videoStream.getVideoTracks(),
      ...audioDest.stream.getAudioTracks(),
    ]);

    const recorder = new MediaRecorder(combined, {mimeType: mime});
    const chunks   = [];
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = () => {
      audioCtx.close();
      const blob = new Blob(chunks, {type: mime});
      showMediaModal(URL.createObjectURL(blob), 'video', getSlug());
      btn.disabled = false; btn.textContent = '▶ Wideo + dźwięk';
    };

    // Animacja + nagrywanie
    const t0 = performance.now();
    recorder.start(100);
    src.start();

    const loop = () => {
      const elapsed = performance.now() - t0;
      btn.textContent = `▶ Nagrywanie... ${Math.round(elapsed/100)/10}s`;
      drawAnimFrame(ctx, base, elapsed / 1000, scale, pad);
      if (elapsed < AUDIO_DURATION_MS) requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);

    setTimeout(() => { recorder.stop(); try{src.stop();}catch{} }, AUDIO_DURATION_MS + 300);

  } catch(e) {
    alert('Błąd wideo: ' + e.message);
    btn.disabled = false; btn.textContent = '▶ Wideo + dźwięk';
  }
});
